version: 2

# Updates are proposed once a week, with the minor and patch updates of an ecosystem together in one pull request, and
# every major update on its own, since those are the ones that can break something.
updates:
  - package-ecosystem: nuget
    directories:
      - /
      - /backend
      - /backend.tests
      - /plugins/*/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # TypeScript 7 is the native compiler, and the dashboard does not build with it yet. Moving to it is a decision of
    # its own, so Dependabot does not propose it.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The base images of the Docker build are pinned by digest, so without this they would never be updated.
  - package-ecosystem: docker
    directory: /.do
    schedule:
      interval: weekly
