name: Build and publish Docker images

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  # Nothing is built or pushed to Docker Hub unless every test passes.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Run backend tests
        run: dotnet test magic.sln

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend tests
        run: |
          cd frontend
          npm ci --ignore-scripts
          npm run test

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ==========================
      # Checkout repo
      # ==========================
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ==========================
      # Extract version from tag
      # ==========================
      - name: Get tag version number
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # ==========================
      # Build the dashboard ONCE (native runner)
      # ==========================
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build dashboard frontend
        run: |
          cd frontend
          npm ci --ignore-scripts
          npm run build
          cd ..

      # ==========================
      # Setup Docker multi-arch
      # ==========================
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # ==========================
      # Login to DockerHub
      # ==========================
      - name: Login to DockerHub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      # ==========================
      # Build & Push Backend (multi-arch)
      # ==========================
      - name: Build and push backend (multi-arch)
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f ./docker.backend \
            -t servergardens/magic-backend:latest \
            -t servergardens/magic-backend:${{ steps.get_version.outputs.VERSION }} \
            --push .

      # ==========================
      # Build & Push Frontend (multi-arch, FAST)
      # Uses single docker.frontend file (nginx only)
      # ==========================
      - name: Build and push frontend (multi-arch)
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f ./docker.frontend \
            -t servergardens/magic-frontend:latest \
            -t servergardens/magic-frontend:${{ steps.get_version.outputs.VERSION }} \
            --push .

      # ==========================
      # Build & Push All-In-One (multi-arch)
      # Frontend + backend in ONE image - used by droplet,
      # marketplace, and other single-container deployments.
      # Builds the dashboard inside the image (self-contained),
      # identical artifact to .do/Dockerfile.backend.
      # ==========================
      - name: Build and push all-in-one (multi-arch)
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f ./.do/Dockerfile.backend \
            -t servergardens/magic-aio:latest \
            -t servergardens/magic-aio:${{ steps.get_version.outputs.VERSION }} \
            --push .

      # ==========================
      # Create SMALL magic.zip (deployment compatible)
      # Keeps backend/ structure unchanged
      # ==========================
      - name: Package deployment zip (small)
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}

          echo "Creating deployment zip..."

          mkdir release
          cp -r backend release/

          # Remove build junk + source code (optional but huge savings)
          rm -rf release/backend/bin
          rm -rf release/backend/obj

          # Zip ONLY backend folder (deployment expects /backend/)
          cd release
          zip -r ../magic-$VERSION.zip backend
          cd ..

          # Also create magic.zip for "latest"
          cp magic-$VERSION.zip magic.zip

      # ==========================
      # Upload release zips (Cloudflare-safe)
      # ==========================
      - name: Upload release zip files
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}

          curl -X PUT \
            -H "Content-Type: multipart/form-data" \
            -H "Authorization: Bearer $API_TOKEN" \
            -F "folder=/etc/releases/" \
            -F "file=@magic-$VERSION.zip" \
            "https://ainiro.io/magic/system/file-system/file"

          curl -X PUT \
            -H "Content-Type: multipart/form-data" \
            -H "Authorization: Bearer $API_TOKEN" \
            -F "folder=/etc/releases/" \
            -F "file=@magic.zip" \
            "https://ainiro.io/magic/system/file-system/file"

  # ==========================
  # Publish to the official MCP Registry.
  # Runs AFTER the Docker images are pushed, because the registry pulls
  # the magic-aio image and verifies its io.modelcontextprotocol.server.name
  # label against server.json.
  # ==========================
  publish-mcp:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # Required for OIDC authentication against the registry
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mcp-publisher
        run: |
          curl -L --proto '=https' --tlsv1.2 "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # server.json in git is a template; stamp the released version and
      # the matching Docker Hub image tag into it before publishing.
      - name: Stamp version into server.json
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          jq --arg v "$VERSION" --arg tag "$TAG" \
            '.version = $v | .packages[0].identifier = "docker.io/servergardens/magic-aio:" + $tag' \
            server.json > server.tmp && mv server.tmp server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

  # ==========================
  # Signs the three images and attaches a software bill of materials (SBOM) to each.
  # Runs AFTER the images are pushed, as a job of its own, so a problem with signing is reported without stopping
  # the images, the zips or the MCP registry entry from being published.
  #
  # Signing is keyless: the signature is made with a short-lived certificate tied to the identity of this workflow,
  # through OIDC, and is recorded in the public Sigstore transparency log, so there is no key to store or to rotate.
  # Anyone can check an image with cosign, see SECURITY.md.
  # ==========================
  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Lets the job ask for its signing certificate, which is what makes the signing keyless

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # The signatures and the SBOMs are stored in the registry next to the images, so the job has to be allowed to push.
      - name: Login to DockerHub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      # Always by digest, since a tag can be moved, and the digest of the tag is what was just pushed.
      - name: Sign the images and attach their SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mkdir sboms
          for IMAGE in magic-backend magic-frontend magic-aio; do
            REF=servergardens/$IMAGE
            DIGEST=$(docker buildx imagetools inspect "$REF:$VERSION" --format '{{.Manifest.Digest}}')
            echo "Signing $REF@$DIGEST"
            cosign sign --yes "$REF@$DIGEST"
            "$SYFT" "$REF@$DIGEST" -o "cyclonedx-json=sboms/$IMAGE-$VERSION.cdx.json"
            cosign attest --yes --type cyclonedx --predicate "sboms/$IMAGE-$VERSION.cdx.json" "$REF@$DIGEST"
          done

      # A copy of the SBOMs that can be read without cosign, kept with the run.
      - name: Keep the SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sboms
          path: sboms/*.cdx.json
