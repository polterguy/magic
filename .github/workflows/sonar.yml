name: SonarCloud
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A newer push to a pull request makes the run of the older one pointless. Runs on master are all kept, since each is
# the analysis of a commit someone will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Typechecks and builds the dashboard, and runs its tests. Separate from the
  # SonarCloud job, since it needs none of its tooling, and a broken frontend
  # must fail the run even though nothing in the .NET build would notice.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build   # tsc, then vite build
      - run: npm run test

  # Builds the solution with the Roslyn and Sonar rules of .editorconfig and warnings as errors, which is what lets a
  # violation fail the run, before SonarCloud has looked at anything. See Directory.Build.props.
  analyzers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet build magic.sln

  # Runs the tests and has SonarCloud analyse the result. Pull requests from Dependabot and from forks get no secrets,
  # so SONAR_TOKEN is empty there, and the tests are run without the scanner instead.
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history, needed for blame/new-code detection
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Run the tests without SonarCloud
        if: env.SONAR_TOKEN == ''
        env:
          MAGIC_TEST_CHROME: /usr/bin/google-chrome
        run: dotnet test magic.sln
      - if: env.SONAR_TOKEN != ''
        run: dotnet tool install --global dotnet-sonarscanner
      - if: env.SONAR_TOKEN != ''
        env:
          MAGIC_TEST_CHROME: /usr/bin/google-chrome
        run: |
          dotnet sonarscanner begin \
            /k:"polterguy_magic" /o:"polterguy" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=600 \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="frontend/**,backend/files/**,backend/Program.cs,backend/Startup.cs" \
            /d:sonar.exclusions="update-deployments.sh,**/*.sql,.do/**,.vscode/**,backend/files/system/openai/front.files/chat/*.css,**/*.tests/**"
          dotnet build magic.sln -p:SonarGate=false
          dotnet test magic.sln --no-build --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"