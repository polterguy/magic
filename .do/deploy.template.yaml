spec:
  name: magic-cloud
  services:
  - name: magic
    git:
      branch: master
      repo_clone_url: https://github.com/polterguy/magic.git
    dockerfile_path: .do/Dockerfile.backend
    http_port: 4444
    routes:
    - path: /
    envs:
    - key: ASPNETCORE_ENVIRONMENT
      value: Production
    - key: magic__auth__secret
      scope: RUN_TIME
      type: SECRET
