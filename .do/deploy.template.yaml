spec:
  name: magic-cloud
  services:
  - name: frontend
    git:
      branch: master
      repo_clone_url: https://github.com/polterguy/magic.git
    dockerfile_path: .do/Dockerfile.frontend
    http_port: 80
    routes:
    - path: /
  - name: backend
    git:
      branch: master
      repo_clone_url: https://github.com/polterguy/magic.git
    dockerfile_path: docker.backend
    http_port: 4444
    routes:
    - path: /api
    envs:
    - key: ASPNETCORE_ENVIRONMENT
      value: Production
    - key: MAGIC_AUTH_SECRET
      scope: RUN_AND_BUILD_TIME
    - key: MAGIC_AUTH_HTTPS_ONLY
      value: "true"
    - key: MAGIC_FRONTEND_URLS
      scope: RUN_TIME
