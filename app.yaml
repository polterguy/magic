name: magic-cloud
services:
- name: frontend
  github:
    branch: master
    deploy_on_push: true
  dockerfile_path: docker.frontend
  http_port: 80
  ports:
  - name: http
    protocol: HTTP
    source_port: 80
  routes:
  - path: /
    component_name: frontend
- name: backend
  github:
    branch: master
    deploy_on_push: true
  dockerfile_path: docker.backend
  http_port: 4444
  health_check:
    http_path: /health
  ports:
  - name: http
    protocol: HTTP
    source_port: 4444
  envs:
  - key: ASPNETCORE_ENVIRONMENT
    value: Production
  - key: magic:auth:secret
    scope: RUN_AND_BUILD_TIME
    value: ${MAGIC_AUTH_SECRET}
  - key: magic:auth:https-only
    value: "true"
  - key: magic:frontend:urls
    value: https://${APP_DOMAIN}
  routes:
  - path: /api
    component_name: backend
  volumes:
  - name: data
    mount_path: /magic/files/data
    filesystem_label: data
